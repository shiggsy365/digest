{% extends "ereader/base.html" %}{% block title %}Users · Digest{% endblock %}{% block content %}<h2>User accounts</h2>{% if error %}<p class="error">{{ error }}</p>{% endif %}<section class="panel"><h3>Create user</h3><form method="post" action="/admin/users"><input type="hidden" name="form_csrf" value="{{ csrf }}"><label>Username<input name="username" required minlength="3" maxlength="80"></label><label>Role<select name="role">{% for role in roles %}<option value="{{ role.value }}">{{ role.value|title }}</option>{% endfor %}</select></label><label>Password<input name="password" type="password" required minlength="12"></label><label>Confirm password<input name="confirm" type="password" required minlength="12"></label><button>Create user</button></form></section>{% for account in users %}<section class="panel"><h3>{{ account.username }}</h3><form method="post" action="/admin/users/{{ account.id }}/update"><input type="hidden" name="form_csrf" value="{{ csrf }}"><label>Username<input name="username" value="{{ account.username }}" required></label><label>Role<select name="role">{% for role in roles %}<option value="{{ role.value }}"{% if role == account.role %} selected{% endif %}>{{ role.value|title }}</option>{% endfor %}</select></label><label><input type="checkbox" name="is_active"{% if account.is_active %} checked{% endif %}> Active</label><button>Save account</button></form><form method="post" action="/admin/users/{{ account.id }}/password"><input type="hidden" name="form_csrf" value="{{ csrf }}"><h4>Reset password</h4><label>New password<input name="password" type="password" required minlength="12"></label><label>Confirm password<input name="confirm" type="password" required minlength="12"></label><button>Reset password</button></form></section>{% endfor %}{% endblock %}
